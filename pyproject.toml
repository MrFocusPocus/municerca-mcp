[project]
name = "municerca-mcp"
version = "0.1.0"
description = "MCP server for municipal citizen service (OIRS, tramites) in a fictional Chilean municipality"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "pydantic>=2.7", "anthropic>=0.40"]

[project.scripts]
municerca-mcp = "municerca_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/municerca_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "agent", "evals", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
