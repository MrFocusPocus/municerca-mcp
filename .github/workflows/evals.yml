name: evals
on:
  pull_request:
    paths:
      - "src/**"
      - "agent/**"
      - "evals/**"
      - "CLAUDE.md"
      - ".claude/**"
  schedule:
    - cron: "0 7 * * *" # nightly, 04:00 in Santiago
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      # DeepSeek through its Anthropic compatible endpoint. The harness uses the anthropic SDK,
      # so the provider is chosen by these variables only. Override any of them with a
      # repository variable of the same name.
      ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}
      MUNICERCA_AGENT_MODEL: ${{ vars.MUNICERCA_AGENT_MODEL || 'deepseek-flash' }}
      MUNICERCA_JUDGE_MODEL: ${{ vars.MUNICERCA_JUDGE_MODEL || 'deepseek-v4-pro' }}
      EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '0.9' }}
    steps:
      - name: Require the DeepSeek key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is not set. Add it with: gh secret set DEEPSEEK_API_KEY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - name: Run eval suite (fails below threshold, prints cost)
        run: uv run python -m evals.run --label ci --threshold "$EVAL_THRESHOLD" --out evals/results/ci.json
      - name: No PII in traces
        if: always()
        run: uv run python scripts/check_pii.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/ci.json
            traces/
