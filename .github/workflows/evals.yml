name: evals
on:
  pull_request:
    paths:
      - "src/**"
      - "agent/**"
      - "evals/**"
      - "CLAUDE.md"
      - ".claude/**"
  schedule:
    - cron: "0 7 * * *" # nightly, 04:00 in Santiago
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_THRESHOLD: ${{ vars.EVAL_THRESHOLD || '0.9' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - name: Run eval suite (fails below threshold, prints cost)
        run: uv run python -m evals.run --label ci --threshold "$EVAL_THRESHOLD" --out evals/results/ci.json
      - name: No PII in traces
        if: always()
        run: uv run python scripts/check_pii.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/ci.json
            traces/
